<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing</title>
    <link href="index.css" rel="stylesheet" />
    <script src="index.js" defer></script>
</head>
<body>
<section id="preboarding-section">
<h1 id="preboarding-heading">Practice mental multiplication</h1>
<form id="start-session">
<fieldset>
<div>
<label for="session-goal">How many problems do you want to solve within the duration?</label>
<input id="session-goal" type="number" min="1"  />
</div>
<div>
<label for="session-duration">In Seconds:</label>
<input id="session-duration" type="number" min="1" required />
</div>
<div>
<label for="first-operand-length">How many digits should the first operand be?</label>
<input id="first-operand-length" type="number" min="1" max="16" placeholder="0" required />
</div>
<div>
<label for="second-operand-length">How many digits should the second operand be?</label>
<input id="second-operand-length" type="number" min="1" max="16" placeholder="0" />
</div>
<math id="sample-problem" class="hidden"><mrow><mn id="sample-operand-1"></mn><mo id="sample-operator">×</mo><mn id="sample-operand-2"></mn></mrow></math>
<p class="feedback" id="sample-problem-feedback"></p>
<button>Start session</button>
</fieldset>
<fieldset>
<label for="volume-slider">Volume</label>
<input id="volume-slider" type="range" min="0" max="100" />
<p id="volume-value"></p>
</fieldset>
</form>
</section>
<div id="session-section-container" class="hidden">
<main>
<math id="math-problem"></math>
<span id="session-countdown"></span>
<span id="accuracy"></span>
<form id="problem-answer-form">
<label for="problem-answer-input">Answer:</label>
<input id="problem-answer-input" type="number" required />
<button id="problem-answer-submit">Submit answer</button>
</form>
</main>
</div>
</html>
