<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing</title>
    <link href="index.css" rel="stylesheet" />
    <script src="index.js" defer></script>
  </head>
  <body>
    <section id="preboarding-section">
      <h1 id="preboarding-heading">Practice mental multiplication</h1>
      <form id="preboarding-form">
            <label for="preboarding-goal-input"
              >How many problems do you want to solve this session?</label
            >
            <input id="preboarding-goal-input" class="input input--preboarding" type="number" min="1" placeholder="1" required />
            <label for="preboarding-duration-input">How many seconds should this session be?</label>
            <input id="preboarding-duration-input" class="input input--preboarding" type="number" min="1" placeholder="1" required />
            <label for="preboarding-first-operand-digits-input"
              >How many digits should the first operand be?</label
            >
            <input
              id="preboarding-first-operand-digits-input"
              class="input input--preboarding"
              type="number"
              min="1"
              max="16"
              placeholder="1"
              required
            />
            <label for="preboarding-second-operand-digits-input"
              >How many digits should the second operand be?</label
            >
            <input
              id="preboarding-second-operand-digits-input"
              class="input input--preboarding"
              type="number"
              min="1"
              max="16"
              placeholder="1"
            />
<div id="preboarding-problem-container"><math id="preboarding-problem" class="hidden"><mn id="preboarding-first-operand"></mn><mo id="preboarding-operator">×</mo><mn id="preboarding-second-operand"></mn>      
        </math></div>
          <button id="preboarding-start-btn">Start session</button>
          </form>
          <div id="preboarding-volume-container" class="volume-container">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="icon"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M17.25 9.75 19.5 12m0 0 2.25 2.25M19.5 12l2.25-2.25M19.5 12l-2.25 2.25m-10.5-6 4.72-4.72a.75.75 0 0 1 1.28.53v15.88a.75.75 0 0 1-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.009 9.009 0 0 1 2.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75Z"
              />
            </svg>
            <input
              id="preboarding-volume-input"
              class="input input--preboarding-volume"
              type="range"
              min="0"
              max="100"
            />
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="icon"
              id="max-volume-icon"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M19.114 5.636a9 9 0 0 1 0 12.728M16.463 8.288a5.25 5.25 0 0 1 0 7.424M6.75 8.25l4.72-4.72a.75.75 0 0 1 1.28.53v15.88a.75.75 0 0 1-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.009 9.009 0 0 1 2.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75Z"
              />
            </svg>
            <div class="preboarding-container">
          <label for="preboarding-volume-input" class="label-volume">Volume:</label>
          <p id="preboarding-volume-value" class="volume-value"></p>
          </div>
        </div>
    </section>
    <section id="session-container" class="hidden">
      <main>
        <div id="session-problem-container">
        <math id="session-problem"><mn id="session-first-operand"></mn><mo id="session-operator">×</mo><mn id="session-second-operand"></mn></math>
        <hr id="session-problem-card-bottom-divider" />
        </div>
        <form id="session-answer-form">
          <label for="session-answer-input" class="label label--session">Answer:</label>
          <input id="session-answer-input" class="input input--session" type="number" min="0" placeholder="1" required />
          <button id="session-submit-btn" class="btn btn--session">Submit answer</button>
        </form>
        <p id="session-accuracy"></p>
        <p id="session-answer-feedback"></p>
        <p id="session-countdown"></p>
        <button id="session-pause-btn" class="btn btn--session">Pause session</button>
      </main>
    </section>
    <section id="pause-menu-container" class="hidden">
      <button id="pause-menu-resume-btn">Resume session</button>
     <div class="volume-container">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M17.25 9.75 19.5 12m0 0 2.25 2.25M19.5 12l2.25-2.25M19.5 12l-2.25 2.25m-10.5-6 4.72-4.72a.75.75 0 0 1 1.28.53v15.88a.75.75 0 0 1-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.009 9.009 0 0 1 2.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75Z"
              />
            </svg>
            <input
              id="pause-menu-volume-input"
              class="input input--volume"
              type="range"
              min="0"
              max="100"
            />
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="icon"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M19.114 5.636a9 9 0 0 1 0 12.728M16.463 8.288a5.25 5.25 0 0 1 0 7.424M6.75 8.25l4.72-4.72a.75.75 0 0 1 1.28.53v15.88a.75.75 0 0 1-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.009 9.009 0 0 1 2.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75Z"
              />
            </svg>
          </div>
          <label for="pause-menu-volume-input" class="label label--volume-input">Volume:</label>
          <p id="pause-menu-volume-value" class="volume-value"></p>
      </div>
      <p>When you get back, a new problem will be generated.</p>
      <p id="pause-menu-countdown"></p>
    </section>
  </body>
</html>
